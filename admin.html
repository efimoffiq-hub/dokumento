<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — Документо</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --surface-2: #1c1c26;
      --border: rgba(255,255,255,0.08); --text: #f4f4f5; --text-muted: #a1a1aa;
      --accent: #6366f1; --accent-light: #818cf8; --green: #22c55e; --red: #f87171;
      --radius: 12px; --radius-lg: 20px;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* Login screen */
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px; max-width: 380px; width: 100%; }
    .login-card h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; text-align: center; }
    .login-card p { color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-bottom: 24px; }
    .login-card input { width: 100%; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.95rem; margin-bottom: 14px; }
    .login-card input:focus { outline: none; border-color: var(--accent); }
    .login-card button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--accent), #a855f7); color: #fff; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .login-card button:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-error { color: var(--red); font-size: 0.85rem; text-align: center; margin-top: 12px; min-height: 18px; }

    /* Dashboard */
    .dash-wrap { display: none; max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
    .dash-wrap.is-visible { display: block; }
    .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
    .dash-header h1 { font-size: 1.4rem; font-weight: 700; }
    .dash-header .sub { color: var(--text-muted); font-size: 0.85rem; }
    .btn-logout { padding: 8px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-family: inherit; font-size: 0.85rem; cursor: pointer; }
    .btn-logout:hover { color: var(--text); }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    @media (max-width: 800px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } }

    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; }
    .stat-card .label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .stat-card .value { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
    .stat-card.accent .value { color: var(--accent-light); }
    .stat-card.green .value { color: var(--green); }

    .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; }
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 12px 16px; color: var(--text-muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
    .badge.pro { background: rgba(99,102,241,0.15); color: var(--accent-light); }
    .badge.free { background: rgba(161,161,170,0.15); color: var(--text-muted); }

    .refresh-row { display: flex; justify-content: flex-end; margin-bottom: 16px; }
    .btn-refresh { padding: 8px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-family: inherit; font-size: 0.85rem; cursor: pointer; }
    .btn-refresh:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="login-wrap" id="login-screen">
    <div class="login-card">
      <h1>🔒 Админка Документо</h1>
      <p>Введите пароль для доступа</p>
      <input type="password" id="admin-password" placeholder="Пароль" autocomplete="off">
      <button type="button" id="btn-login">Войти</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <div class="dash-wrap" id="dashboard">
    <div class="dash-header">
      <div>
        <h1>Документо — Аналитика</h1>
        <div class="sub" id="last-updated"></div>
      </div>
      <button type="button" class="btn-logout" id="btn-logout">Выйти</button>
    </div>

    <div class="refresh-row">
      <button type="button" class="btn-refresh" id="btn-refresh">↻ Обновить</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Всего пользователей</div>
        <div class="value" id="stat-total-users">—</div>
      </div>
      <div class="stat-card green">
        <div class="label">Сегодня зарегистрировалось</div>
        <div class="value" id="stat-today-users">—</div>
      </div>
      <div class="stat-card accent">
        <div class="label">Pro подписчиков</div>
        <div class="value" id="stat-pro-users">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Free пользователей</div>
        <div class="value" id="stat-free-users">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Документов создано</div>
        <div class="value" id="stat-total-docs">—</div>
      </div>
      <div class="stat-card green">
        <div class="label">Доход в месяц (оценка)</div>
        <div class="value" id="stat-revenue">—</div>
      </div>
    </div>

    <div class="section-title">Последние регистрации</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Email</th><th>План</th><th>Документов</th><th>Дата</th></tr>
        </thead>
        <tbody id="recent-users-body">
          <tr><td colspan="4" style="text-align:center;color:var(--text-muted)">Загрузка...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API = 'https://dokumento-production.up.railway.app';
    const ADMIN_TOKEN_KEY = 'dokumento_admin_token';

    function getToken() { return localStorage.getItem(ADMIN_TOKEN_KEY); }
    function setToken(t) { localStorage.setItem(ADMIN_TOKEN_KEY, t); }
    function clearToken() { localStorage.removeItem(ADMIN_TOKEN_KEY); }

    function showLogin() {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('dashboard').classList.remove('is-visible');
    }
    function showDashboard() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').classList.add('is-visible');
      loadStats();
    }

    document.getElementById('btn-login').addEventListener('click', login);
    document.getElementById('admin-password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });

    async function login() {
      var pass = document.getElementById('admin-password').value;
      var errEl = document.getElementById('login-error');
      var btn = document.getElementById('btn-login');
      errEl.textContent = '';
      if (!pass) { errEl.textContent = 'Введите пароль'; return; }
      btn.disabled = true;
      try {
        var res = await fetch(API + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        });
        var data = await res.json();
        if (!res.ok) { errEl.textContent = data.error || 'Ошибка входа'; btn.disabled = false; return; }
        setToken(data.token);
        document.getElementById('admin-password').value = '';
        showDashboard();
      } catch(e) {
        errEl.textContent = 'Не удалось связаться с сервером';
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('btn-logout').addEventListener('click', function() {
      clearToken();
      showLogin();
    });
    document.getElementById('btn-refresh').addEventListener('click', loadStats);

    async function loadStats() {
      var token = getToken();
      if (!token) { showLogin(); return; }

      try {
        var res = await fetch(API + '/api/admin/stats', {
          headers: { Authorization: 'Bearer ' + token }
        });
        if (res.status === 401) {
          clearToken();
          showLogin();
          document.getElementById('login-error').textContent = 'Сессия истекла, войдите снова';
          return;
        }
        var data = await res.json();

        document.getElementById('stat-total-users').textContent = data.totalUsers.toLocaleString('ru-RU');
        document.getElementById('stat-today-users').textContent = data.todayUsers.toLocaleString('ru-RU');
        document.getElementById('stat-pro-users').textContent = data.proUsers.toLocaleString('ru-RU');
        document.getElementById('stat-free-users').textContent = data.freeUsers.toLocaleString('ru-RU');
        document.getElementById('stat-total-docs').textContent = data.totalDocs.toLocaleString('ru-RU');
        document.getElementById('stat-revenue').textContent = data.monthlyRevenue.toLocaleString('ru-RU') + ' ₽';

        var tbody = document.getElementById('recent-users-body');
        if (data.recentUsers && data.recentUsers.length) {
          tbody.innerHTML = data.recentUsers.map(function(u) {
            var date = u.created_at ? new Date(u.created_at).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
            var badgeClass = u.plan === 'pro' ? 'pro' : 'free';
            var badgeText = u.plan === 'pro' ? 'Pro' : 'Free';
            return '<tr><td>' + escHtml(u.email) + '</td><td><span class="badge ' + badgeClass + '">' + badgeText + '</span></td><td>' + u.documents_count + '</td><td>' + date + '</td></tr>';
          }).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">Нет данных</td></tr>';
        }

        document.getElementById('last-updated').textContent = 'Обновлено: ' + new Date().toLocaleTimeString('ru-RU');
      } catch(e) {
        console.error(e);
      }
    }

    function escHtml(str) {
      var d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // Init
    if (getToken()) { showDashboard(); } else { showLogin(); }
  </script>
</body>
</html>
